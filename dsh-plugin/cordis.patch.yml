# dsh-manage-api bundle patch.
# `name` 从 profile 的 node_modules 解析（`dsh plugin --profile <profile> add <path>` 装进去的）。
# 有默认值时可以不写 config；需要覆盖时取消注释即可（写在这里的 config 会覆盖代码默认值）。
- insert:
    - id: manage-api
      name: dsh-manage-api
      config:
        port: 4319
        autoStart: true
        # 开发期指向仓库根；装成 npm 包后可删掉这一行，走依赖解析。
        runtimeDir: D:/AgentWorkPlace/DSH/ManageAPI
